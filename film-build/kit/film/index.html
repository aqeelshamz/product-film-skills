<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Product film</title>
<style>

  @font-face { font-family: 'Display'; src: url(../assets/fonts/display.woff2) format('woff2'), local('Helvetica Neue'), local('Arial'); font-weight: 200 900; }
  @font-face { font-family: 'UI'; src: url(../assets/fonts/ui.woff2) format('woff2'), local('Helvetica Neue'), local('Arial'); font-weight: 200 900; }

  .scene { position: absolute; inset: 0; overflow: hidden; }
  .abs { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
  .row { display: flex; align-items: center; }
  .nw { white-space: nowrap; }
